<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vídeo de apoio | Grupo Asserth</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --chumbo:#1E2227;
    --cinza-medio:#5F6368;
    --creme:#F5F1EC;
    --creme-elev:#FBFAF7;
    --creme-linha:#E7E0D5;
    --dourado:#D3A642;
    --dourado-escuro:#B98A2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--creme);
    font-family:'Montserrat',Arial,Helvetica,sans-serif;
    color:var(--chumbo);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--chumbo);
    padding:22px 20px;
    display:flex;
    justify-content:center;
  }
  header img{
    height:34px;
    width:auto;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }
  .card{
    width:100%;
    max-width:820px;
    background:var(--creme-elev);
    border:1px solid var(--creme-linha);
    border-radius:16px;
    padding:36px;
    text-align:center;
  }
  .eyebrow{
    font-size:13px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--dourado-escuro);
    margin:0 0 10px 0;
  }
  h1{
    font-size:24px;
    font-weight:800;
    margin:0 0 12px 0;
    line-height:1.3;
  }
  .subtitulo{
    font-size:15px;
    color:var(--cinza-medio);
    margin:0 0 28px 0;
    line-height:1.6;
  }
  video{
    width:100%;
    max-width:100%;
    border-radius:12px;
    background:#000;
    display:block;
  }
  .fallback{
    font-size:13px;
    color:var(--cinza-medio);
    margin-top:18px;
  }
  .fallback a{
    color:var(--dourado-escuro);
    font-weight:700;
    text-decoration:none;
  }
  .fallback a:hover{
    text-decoration:underline;
  }
  footer{
    background:var(--chumbo);
    color:#9A9EA3;
    text-align:center;
    font-size:12px;
    padding:18px 20px;
  }
  footer .brand{
    white-space:nowrap;
  }
  @media (max-width:640px){
    .card{padding:24px 18px; border-radius:12px;}
    h1{font-size:20px;}
  }
</style>
</head>
<body>

<header>
  <img src="https://www.grupoasserth.com.br/wp-content/uploads/2021/10/asserth.png" alt="Grupo Asserth">
</header>

<main>
  <div class="card">
    <p class="eyebrow">Comunicado interno</p>
    <h1>Vídeo de apoio — acesso ao novo sistema de ponto</h1>
    <p class="subtitulo">Assista abaixo o passo a passo e repasse aos colaboradores da sua equipe.</p>

    <video controls playsinline preload="metadata">
      <source src="https://raw.githubusercontent.com/Cadu0809/comunicado_dp_novoponto/main/WhatsApp%20Video%202026-08-28%20at%2018.11.41.mp4" type="video/mp4">
      Seu navegador não é compatível com a reprodução deste vídeo.
    </video>

    <p class="fallback">
      O vídeo não carregou? <a href="https://raw.githubusercontent.com/Cadu0809/comunicado_dp_novoponto/main/WhatsApp%20Video%202026-08-28%20at%2018.11.41.mp4">Baixe o arquivo diretamente aqui</a>.
    </p>
  </div>
</main>

<footer>
  <span class="brand">© 2026 Grupo Asserth.</span> Todos os direitos reservados.
</footer>

</body>
</html>
